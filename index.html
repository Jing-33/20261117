<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird - HTML5 小遊戲</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            overflow: hidden;
        }
        canvas {
            display: block;
            background-color: #70c5ce;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="360" height="600"></canvas>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // 簡易 Web Audio 音效生成器（免外部音檔）
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'flap') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(320, now);
            osc.frequency.exponentialRampToValueAtTime(520, now + 0.1);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'score') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.setValueAtTime(850, now + 0.08);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'hit') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(160, now);
            osc.frequency.exponentialRampToValueAtTime(45, now + 0.25);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
            osc.start(now);
            osc.stop(now + 0.25);
        }
    }

    // 遊戲狀態與變數
    let frames = 0;
    let score = 0;
    let bestScore = localStorage.getItem('flappy_best_score') || 0;
    let gameState = 'START'; // 'START', 'PLAYING', 'GAMEOVER'
    const groundHeight = 80;

    // 背景雲朵
    const clouds = [
        { x: 50, y: 100, size: 1 },
        { x: 220, y: 160, size: 0.8 },
        { x: 340, y: 80, size: 1.1 }
    ];

    // 小鳥物件
    const bird = {
        x: 80,
        y: 250,
        radius: 15,
        velocity: 0,
        gravity: 0.42,
        jump: -7.5,
        rotation: 0,

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            // 根據速度計算俯仰角度
            this.rotation = Math.min(Math.PI / 3, Math.max(-Math.PI / 5, (this.velocity * 0.08)));
            ctx.rotate(this.rotation);

            // 身體
            ctx.fillStyle = '#f1c40f';
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#2c3e50';
            ctx.stroke();

            // 翅膀（隨幀數拍動）
            const wingY = (gameState !== 'GAMEOVER' && frames % 12 < 6) ? -2 : 4;
            ctx.fillStyle = '#f39c12';
            ctx.beginPath();
            ctx.ellipse(-4, wingY, 8, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // 眼睛
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(6, -5, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(8, -5, 2, 0, Math.PI * 2);
            ctx.fill();

            // 嘴巴
            ctx.fillStyle = '#e67e22';
            ctx.beginPath();
            ctx.moveTo(11, -1);
            ctx.lineTo(22, 3);
            ctx.lineTo(11, 7);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.restore();
        },

        update() {
            if (gameState === 'START') {
                // 待機時上下微幅漂浮
                this.y = 250 + Math.sin(frames * 0.08) * 6;
            } else if (gameState === 'PLAYING') {
                this.velocity += this.gravity;
                this.y += this.velocity;

                // 碰到天花板限制
                if (this.y - this.radius <= 0) {
                    this.y = this.radius;
                    this.velocity = 0;
                }

                // 碰到地板判定死亡
                if (this.y + this.radius >= canvas.height - groundHeight) {
                    this.y = canvas.height - groundHeight - this.radius;
                    triggerGameOver();
                }
            }
        },

        flap() {
            this.velocity = this.jump;
            playSound('flap');
        },

        reset() {
            this.y = 250;
            this.velocity = 0;
            this.rotation = 0;
        }
    };

    // 水管陣列與邏輯
    const pipes = {
        list: [],
        width: 56,
        gap: 135, // 上下水管間距（調大變簡單、調小變難）
        speed: 2.5,

        draw() {
            for (let p of this.list) {
                // 上水管主體
                ctx.fillStyle = '#2ecc71';
                ctx.fillRect(p.x, 0, this.width, p.top);
                ctx.strokeStyle = '#27ae60';
                ctx.lineWidth = 3;
                ctx.strokeRect(p.x, -2, this.width, p.top + 2);

                // 上水管管口
                ctx.fillStyle = '#27ae60';
                ctx.fillRect(p.x - 3, p.top - 22, this.width + 6, 22);
                ctx.strokeRect(p.x - 3, p.top - 22, this.width + 6, 22);

                // 下水管主體
                const bottomY = p.top + this.gap;
                const bottomHeight = canvas.height - groundHeight - bottomY;
                ctx.fillStyle = '#2ecc71';
                ctx.fillRect(p.x, bottomY, this.width, bottomHeight);
                ctx.strokeRect(p.x, bottomY, this.width, bottomHeight);

                // 下水管管口
                ctx.fillStyle = '#27ae60';
                ctx.fillRect(p.x - 3, bottomY, this.width + 6, 22);
                ctx.strokeRect(p.x - 3, bottomY, this.width + 6, 22);
            }
        },

        update() {
            if (gameState !== 'PLAYING') return;

            // 每 105 幀產生一組新水管
            if (frames % 105 === 0) {
                const minTop = 60;
                const maxTop = canvas.height - groundHeight - this.gap - 60;
                const topHeight = Math.floor(Math.random() * (maxTop - minTop + 1)) + minTop;
                this.list.push({
                    x: canvas.width,
                    top: topHeight,
                    passed: false
                });
            }

            for (let i = 0; i < this.list.length; i++) {
                let p = this.list[i];
                p.x -= this.speed;

                // 碰撞偵測（稍微內縮 3px 讓手感更友善）
                const hitBox = bird.radius - 3;
                if (
                    bird.x + hitBox > p.x &&
                    bird.x - hitBox < p.x + this.width &&
                    (bird.y - hitBox < p.top || bird.y + hitBox > p.top + this.gap)
                ) {
                    triggerGameOver();
                }

                // 得分偵測
                if (!p.passed && p.x + this.width < bird.x) {
                    p.passed = true;
                    score++;
                    playSound('score');
                    if (score > bestScore) {
                        bestScore = score;
                        localStorage.setItem('flappy_best_score', bestScore);
                    }
                }

                // 移除超出畫面的水管
                if (p.x + this.width < -10) {
                    this.list.shift();
                    i--;
                }
            }
        },

        reset() {
            this.list = [];
        }
    };

    // 繪製背景與地面
    function drawBackground() {
        // 天空漸層
        const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, '#4ec0ca');
        grad.addColorStop(1, '#bce6eb');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 雲朵
        ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
        for (let c of clouds) {
            if (gameState !== 'GAMEOVER') {
                c.x -= 0.4;
                if (c.x < -60) c.x = canvas.width + 60;
            }
            ctx.beginPath();
            ctx.arc(c.x, c.y, 20 * c.size, 0, Math.PI * 2);
            ctx.arc(c.x + 18 * c.size, c.y - 6 * c.size, 24 * c.size, 0, Math.PI * 2);
            ctx.arc(c.x + 38 * c.size, c.y, 18 * c.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function drawGround() {
        const y = canvas.height - groundHeight;
        // 泥土底色
        ctx.fillStyle = '#ded895';
        ctx.fillRect(0, y, canvas.width, groundHeight);

        // 草皮綠條
        ctx.fillStyle = '#73bf2e';
        ctx.fillRect(0, y, canvas.width, 16);

        // 動態草皮斜紋
        ctx.fillStyle = '#558c22';
        const offset = (gameState === 'GAMEOVER') ? 0 : (frames * pipes.speed) % 24;
        for (let x = -offset; x < canvas.width; x += 24) {
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + 12, y);
            ctx.lineTo(x + 4, y + 16);
            ctx.lineTo(x - 8, y + 16);
            ctx.closePath();
            ctx.fill();
        }

        // 地面上邊線
        ctx.strokeStyle = '#2c3e50';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
    }

    // 繪製 UI 文字與面板
    function drawUI() {
        ctx.textAlign = 'center';

        if (gameState === 'START') {
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 5;
            ctx.font = 'bold 38px sans-serif';
            ctx.strokeText('FLAPPY BIRD', canvas.width / 2, 140);
            ctx.fillText('FLAPPY BIRD', canvas.width / 2, 140);

            ctx.font = 'bold 18px sans-serif';
            ctx.lineWidth = 3;
            ctx.strokeText('點擊畫面 或 按空白鍵開始', canvas.width / 2, 340);
            ctx.fillText('點擊畫面 或 按空白鍵開始', canvas.width / 2, 340);
        } 
        else if (gameState === 'PLAYING') {
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 5;
            ctx.font = 'bold 48px sans-serif';
            ctx.strokeText(score, canvas.width / 2, 80);
            ctx.fillText(score, canvas.width / 2, 80);
        } 
        else if (gameState === 'GAMEOVER') {
            // 結算面板
            const boxW = 240, boxH = 180;
            const boxX = (canvas.width - boxW) / 2;
            const boxY = 180;

            ctx.fillStyle = '#ded895';
            ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.roundRect(boxX, boxY, boxW, boxH, 12);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#e74c3c';
            ctx.font = 'bold 28px sans-serif';
            ctx.fillText('GAME OVER', canvas.width / 2, boxY + 42);

            ctx.fillStyle = '#2c3e50';
            ctx.font = 'bold 20px sans-serif';
            ctx.fillText(`本次分數：${score}`, canvas.width / 2, boxY + 85);
            ctx.fillText(`最高紀錄：${bestScore}`, canvas.width / 2, boxY + 120);

            ctx.fillStyle = '#27ae60';
            ctx.font = 'bold 16px sans-serif';
            ctx.fillText('點擊畫面重新開始', canvas.width / 2, boxY + 158);
        }
    }

    function triggerGameOver() {
        if (gameState !== 'GAMEOVER') {
            gameState = 'GAMEOVER';
            playSound('hit');
        }
    }

    function handleInput(e) {
        if (e.type === 'keydown' && e.code !== 'Space' && e.code !== 'ArrowUp') return;
        if (e.type === 'touchstart') e.preventDefault();

        if (gameState === 'START') {
            gameState = 'PLAYING';
            bird.flap();
        } else if (gameState === 'PLAYING') {
            bird.flap();
        } else if (gameState === 'GAMEOVER') {
            bird.reset();
            pipes.reset();
            score = 0;
            frames = 0;
            gameState = 'START';
        }
    }

    // 綁定輸入事件
    window.addEventListener('keydown', handleInput);
    canvas.addEventListener('mousedown', handleInput);
    canvas.addEventListener('touchstart', handleInput, { passive: false });

    // 主遊戲迴圈
    function loop() {
        drawBackground();
        pipes.update();
        pipes.draw();
        drawGround();
        bird.update();
        bird.draw();
        drawUI();

        frames++;
        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
